};
const speakerColors=['#3b82f6','#ef4444','#10b981','#f59e0b','#8b5cf6','#ec4899','#06b6d4','#f97316','#14b8a6','#6366f1'];let currentListeningId="listening1";
const PKEY='listeningProgress';let progMem={};try{progMem=JSON.parse(localStorage.getItem(PKEY))||{}}catch(e){progMem={}}
function saveProg(id,ok,total){progMem[id]={ok,total};try{localStorage.setItem(PKEY,JSON.stringify(progMem))}catch(e){}}
function isDone(id){return !!progMem[id]}
function updateLock(){const d=isDone(currentListeningId);document.getElementById('text-lock').style.display=d?'none':'block';document.getElementById('dialogue-container').style.display=d?'':'none';document.getElementById('tab-text-btn').innerHTML=d?'2. Mətn':'<i class="fas fa-lock"></i> 2. Mətn'}
function updateToc(){Object.keys(appData).forEach(k=>{const e=document.getElementById('score-'+k);if(e)e.innerText=progMem[k]?'✓ '+progMem[k].ok+'/'+progMem[k].total:''})}
function retryQuiz(){document.querySelectorAll('#questions-container input[type=radio]').forEach(r=>r.checked=false);document.querySelectorAll('#questions-container .result-box').forEach(b=>b.className='result-box');document.querySelectorAll('#questions-container .correct-answer-text').forEach(e=>e.style.display='none');const sb=document.getElementById('score-box');sb.classList.remove('show');sb.innerHTML='';document.getElementById('questions-container').scrollIntoView({behavior:'smooth',block:'start'})}
function toggleSidebar(){document.getElementById('sidebar').classList.toggle('open');document.getElementById('sidebar-overlay').classList.toggle('active')}
function toggleGroup(){document.getElementById('toc-group').classList.toggle('open')}
function closeSidebar(){const s=document.getElementById('sidebar'),o=document.getElementById('sidebar-overlay');if(s.classList.contains('open')){s.classList.remove('open');o.classList.remove('active')}}
function toggleTheme(){const b=document.body,i=document.getElementById('theme-icon');if(b.getAttribute('data-theme')==='dark'){b.removeAttribute('data-theme');i.classList.replace('fa-sun','fa-moon');localStorage.setItem('theme','light')}else{b.setAttribute('data-theme','dark');i.classList.replace('fa-moon','fa-sun');localStorage.setItem('theme','dark')}}
function toggleLayout(){const b=document.body;if(b.classList.contains('centered')){b.classList.replace('centered','full-width');localStorage.setItem('layout','full-width')}else{b.classList.replace('full-width','centered');localStorage.setItem('layout','centered')}}
function openTab(n,b){document.querySelectorAll('.tab-content').forEach(e=>e.classList.remove('active'));document.querySelectorAll('.tab-btn').forEach(e=>e.classList.remove('active'));document.getElementById(n).classList.add('active');if(b)b.classList.add('active')}
function skipAudio(n){const a=document.getElementById('audio-player');a.currentTime=Math.max(0,Math.min(a.duration||1e9,a.currentTime+n))}
function applySpeed(s){const a=document.getElementById('audio-player');a.defaultPlaybackRate=s;a.playbackRate=s;document.querySelectorAll('.speed-btn').forEach(e=>e.classList.toggle('active',parseFloat(e.textContent)===s))}
function changeSpeed(s){applySpeed(s);try{localStorage.setItem('audioSpeed',s)}catch(e){}}
document.addEventListener('keydown',e=>{const t=e.target,tag=t.tagName;if(tag==='INPUT'||tag==='TEXTAREA'||tag==='SELECT'||e.ctrlKey||e.metaKey||e.altKey)return;const a=document.getElementById('audio-player');if(e.code==='Space'){e.preventDefault();if(e.repeat)return;if(a.paused)a.play();else a.pause()}else if(e.code==='ArrowRight'){e.preventDefault();skipAudio(5)}else if(e.code==='ArrowLeft'){e.preventDefault();skipAudio(-5)}});
document.addEventListener('keyup',e=>{if(e.code==='Space'&&e.target.tagName!=='INPUT'&&e.target.tagName!=='TEXTAREA')e.preventDefault()});
function speakWord(w){if('speechSynthesis'in window){window.speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(w);u.lang='en-US';window.speechSynthesis.speak(u)}}
function checkAllAnswers(){const d=appData[currentListeningId];let ok=0,bad=0,skip=0;d.questions.forEach(q=>{const s=document.querySelector(`input[name="${q.id}"]:checked`),b=document.getElementById(`result-${q.id}`),f=document.getElementById(`feedback-${q.id}`);if(!s){skip++;f.innerText="Cavab seçilməyib!";f.className="feedback-title";b.className="result-box show";document.getElementById(`correct-text-${q.id}`).style.display="block";return}if(s.value===q.correct){ok++;f.innerText="Düzdür!";f.className="feedback-title correct";b.className="result-box show correct"}else{bad++;f.innerText="Səhvdir!";f.className="feedback-title wrong";b.className="result-box show wrong"}document.getElementById(`correct-text-${q.id}`).style.display="block"});
const sb=document.getElementById('score-box');sb.innerHTML=`<div class="score-main">Nəticə: ${ok} / ${d.questions.length}</div><div class="score-row"><span class="score-ok"><i class="fas fa-check-circle"></i> Düz: ${ok}</span><span class="score-bad"><i class="fas fa-times-circle"></i> Səhv: ${bad}</span><span class="score-skip"><i class="fas fa-minus-circle"></i> Cavabsız: ${skip}</span></div>${ok+bad>0?'<div class="score-note">Mətn bölməsi açıldı.</div>':''}<button class="retry-btn" onclick="retryQuiz()"><i class="fas fa-rotate-right"></i> Yenidən cəhd et</button>`;sb.classList.add('show');if(ok+bad>0){saveProg(currentListeningId,ok,d.questions.length);updateLock();updateToc()}sb.scrollIntoView({behavior:'smooth',block:'center'})}
function toggleTip(e){const was=e.classList.contains('open');document.querySelectorAll('.sentence-wrapper.open').forEach(x=>x.classList.remove('open'));if(!was){e.classList.add('open');adjustTooltip(e)}}
function adjustTooltip(e){const t=e.querySelector('.tooltip');if(!t)return;t.style.left='50%';t.style.right='auto';t.style.transform='translateX(-50%) translateY(-10px)';const r=t.getBoundingClientRect(),w=window.innerWidth;if(r.left<10){t.style.left=`calc(50% + ${10-r.left}px)`}else if(r.right>w-10){t.style.left=`calc(50% - ${r.right-(w-10)}px)`}}
function loadListening(id){currentListeningId=id;const d=appData[id];document.getElementById('current-title').innerText=d.title;const a=document.getElementById('audio-player');a.src=d.audioSrc;a.load();document.querySelectorAll('.tab-btn').forEach((b,i)=>{if(i===0)b.classList.add('active');else b.classList.remove('active')});document.querySelectorAll('.tab-content').forEach((e,i)=>{if(i===0)e.classList.add('active');else e.classList.remove('active')});
const sbx=document.getElementById('score-box');if(sbx){sbx.classList.remove('show');sbx.innerHTML=''}const q=document.getElementById('questions-container');q.innerHTML='';d.questions.forEach(item=>{let o=item.options.map(x=>`<label class="option-label"><input type="radio" name="${item.id}" value="${x}"><span>${x}</span></label>`).join('');q.innerHTML+=`<div class="question-card"><div class="question-text">${item.q}</div><div class="options-list">${o}</div><div class="result-box" id="result-${item.id}"><div class="feedback-title" id="feedback-${item.id}"></div><div class="correct-answer-text" id="correct-text-${item.id}" style="display:none;">Düzgün cavab: ${item.correctText}</div><div class="explanation-text" style="display:none;"><strong>İzah:</strong> ${item.explanation}</div></div></div>`;setTimeout(()=>{const e=q.querySelector(`#result-${item.id} .explanation-text`);if(e)e.style.display="block"},0)});
const v=document.getElementById('vocab-list');v.innerHTML='';d.vocabulary.forEach(item=>{v.innerHTML+=`<li class="vocab-item"><div class="vocab-en" onclick="speakWord('${item.en.replace(/'/g,"\\'")}')"><i class="fas fa-volume-up"></i> ${item.en}</div><div class="vocab-az">${item.az}</div></li>`});
const t=document.getElementById('dialogue-container');t.innerHTML='';const u=[...new Set(d.text.map(i=>i.speaker))],c={};u.forEach((s,i)=>c[s]=speakerColors[i%speakerColors.length]);const g=[];d.text.forEach(i=>{if(g.length>0&&g[g.length-1].speaker===i.speaker)g[g.length-1].sentences.push(i);else g.push({speaker:i.speaker,sentences:[i]})});
g.forEach(x=>{let h=x.sentences.map(s=>`<span class="sentence-wrapper" onmouseenter="adjustTooltip(this)" onclick="toggleTip(this)">${s.en}<span class="tooltip">${s.az}</span></span>`).join(' ');t.innerHTML+=`<div class="dialogue-block"><span class="speaker-name" style="color:${c[x.speaker]};">${x.speaker}:</span> <span class="speaker-text">${h}</span></div>`});
updateLock();document.querySelectorAll('.toc-item').forEach(e=>e.classList.remove('active'));document.getElementById(`toc-${id}`).classList.add('active');closeSidebar()}
window.onload=()=>{if(localStorage.getItem('theme')==='dark'){document.body.setAttribute('data-theme','dark');document.getElementById('theme-icon').classList.replace('fa-moon','fa-sun')}if(localStorage.getItem('layout')==='full-width')document.body.classList.replace('centered','full-width');const t=document.getElementById('toc-list');let items='';Object.keys(appData).forEach(k=>{items+=`<div class="toc-item" id="toc-${k}" onclick="loadListening('${k}')"><span>${appData[k].title}</span><span class="toc-score" id="score-${k}"></span></div>`});t.innerHTML=`<div class="toc-group" id="toc-group"><div class="toc-group-head" onclick="toggleGroup()"><span>Listening</span><i class="fas fa-chevron-down"></i></div><div class="toc-sub">${items}</div></div>`;loadListening('listening1');updateToc();try{const sp=parseFloat(localStorage.getItem('audioSpeed'));if([0.75,1,1.25].includes(sp))applySpeed(sp)}catch(e){}};
</script>
