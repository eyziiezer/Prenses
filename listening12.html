<head>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
:root{color-scheme:dark;--bg-color:#1a1a2e;--text-color:#e0e0e0;--panel-bg:#16213e;--primary-color:#0f3460;--border-color:#2a2a4a;--vocab-en-color:#60a5fa;--highlight-bg:rgba(96,165,250,.2);--success-color:#4ade80;--success-bg:rgba(74,222,128,.1);--error-color:#f87171;--error-bg:rgba(248,113,113,.1);--tooltip-bg:rgba(15,23,42,.95);--tooltip-text:#f8fafc;--tooltip-border:rgba(255,255,255,.1)}
*{box-sizing:border-box;margin:0;padding:0;transition:background-color .3s,color .3s}
body{font-family:'Segoe UI',Tahoma,sans-serif;background:var(--bg-color);color:var(--text-color);min-height:100vh;max-width:900px;margin:0 auto;padding:20px}
#sidebar-overlay{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.5);z-index:90}
#sidebar-overlay.active{display:block}
#sidebar{width:250px;background:var(--panel-bg);border-right:1px solid var(--border-color);display:flex;flex-direction:column;transform:translateX(-100%);transition:transform .3s;position:absolute;height:100%;z-index:100;box-shadow:2px 0 10px rgba(0,0,0,.1)}
#sidebar.open{transform:translateX(0)}
.sidebar-header{padding:20px;border-bottom:1px solid var(--border-color);font-weight:bold;font-size:1.1rem;display:flex;justify-content:space-between;align-items:center}
.toc-group-head{padding:15px 20px;cursor:pointer;border-bottom:1px solid var(--border-color);display:flex;justify-content:space-between;align-items:center;font-weight:600}
.toc-group-head:hover{background:var(--highlight-bg)}
.toc-group-head .chev{transition:transform .3s;font-size:.8rem}
.toc-group-head .gi{margin-right:8px}
.toc-group.open .chev{transform:rotate(180deg)}
.toc-listening .toc-group-head{border-left:4px solid #3b82f6}
.toc-reading .toc-group-head{border-left:4px solid #10b981}
.toc-reading .toc-item:hover,.toc-reading .toc-item.active{background:#0f766e;color:#fff}
.toc-sub{display:none;background:rgba(255,255,255,.03)}
.toc-group.open .toc-sub{display:block}
.toc-sub .toc-item{padding:12px 20px 12px 40px}
#toc-list{overflow-y:auto;flex:1}
.toc-item{padding:15px 20px;cursor:pointer;border-bottom:1px solid var(--border-color);display:flex;justify-content:space-between;align-items:center;gap:10px}
.toc-right{display:flex;align-items:center;gap:6px}
.toc-up{background:none;border:none;color:inherit;cursor:pointer;padding:5px 8px;border-radius:6px;opacity:.9;font-size:.95rem}
.toc-up:hover{background:rgba(128,128,128,.3)}
#custom-frame{display:none;flex:1;width:100%;min-height:75vh;min-height:75dvh;border:0;border-radius:10px;background:#fff;box-shadow:0 4px 6px rgba(0,0,0,.05)}
.custom-mode #custom-frame{display:block}
.custom-mode .audio-container,.custom-mode .tabs,.custom-mode .tab-content{display:none!important}
.res-summary{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.res-chip{flex:1;min-width:110px;text-align:center;padding:12px 10px;border-radius:10px;background:var(--highlight-bg);font-weight:600;font-size:.9rem}
.res-chip b{display:block;font-size:1.3rem;margin-top:4px}
.res-row{display:flex;justify-content:space-between;align-items:center;gap:15px;padding:14px 16px;margin-bottom:10px;border:1px solid var(--border-color);border-radius:10px;flex-wrap:wrap}
.res-no{font-weight:bold;font-size:1.05rem}
.res-date{opacity:.8;font-size:.9rem;margin-top:3px}
.res-right{text-align:right}
.res-score{font-weight:bold;font-size:1.2rem}
.res-score.good{color:var(--success-color)}.res-score.mid{color:#d97706}.res-score.low{color:var(--error-color)}
.res-detail{opacity:.75;font-size:.85rem;margin-top:3px}
.sidebar-footer{padding:12px;border-top:1px solid var(--border-color);display:flex;flex-direction:column;gap:8px}
.add-reading{background:#0f766e}
.toc-del{background:none;border:none;color:inherit;cursor:pointer;padding:5px 8px;border-radius:6px;opacity:.9;font-size:.95rem}
.toc-del:hover{background:rgba(220,38,38,.45)}
#empty-state{display:none;background:var(--panel-bg);border-radius:10px;box-shadow:0 4px 6px rgba(0,0,0,.05)}
.empty-mode #empty-state{display:block}
.empty-mode .audio-container,.empty-mode .tabs,.empty-mode .tab-content{display:none!important}
.add-btn{width:100%;padding:12px;background:var(--primary-color);color:#fff;border:none;border-radius:8px;font-weight:bold;font-size:1rem;cursor:pointer}
.add-btn:hover{opacity:.9}
.toc-score{font-size:.85rem;font-weight:600;opacity:.9;white-space:nowrap}
.lock-box{text-align:center;padding:40px 20px;opacity:.85}
.lock-box i{font-size:2.2rem;margin-bottom:12px;display:block}
.retry-btn{margin-top:15px;padding:10px 22px;background:var(--primary-color);color:#fff;border:none;border-radius:8px;font-size:1rem;font-weight:bold;cursor:pointer}
.retry-btn:hover{opacity:.9}
.score-note{margin-top:10px;font-size:.9rem;opacity:.8}
.toc-item:hover,.toc-item.active{background:var(--primary-color);color:#fff}
#main-content{flex:1;display:flex;flex-direction:column;height:100%;overflow-y:auto;padding:20px}
.centered #main-content{max-width:900px;margin:0 auto;width:100%}
nav{display:flex;justify-content:space-between;align-items:center;padding:15px 20px;background:var(--panel-bg);border-bottom:1px solid var(--border-color);margin-bottom:20px;border-radius:10px;box-shadow:0 2px 4px rgba(0,0,0,.02)}
.nav-left,.nav-right{display:flex;align-items:center;gap:15px}
.btn{background:none;border:none;color:var(--text-color);font-size:1.2rem;cursor:pointer;padding:8px;border-radius:5px}
.btn:hover{background:var(--border-color)}
.audio-container{background:var(--panel-bg);padding:20px;border-radius:10px;margin-bottom:20px;box-shadow:0 4px 6px rgba(0,0,0,.05)}
audio{width:100%;margin-bottom:10px;outline:none}
.speed-controls{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.skip-btn{background:var(--border-color);border:none;padding:5px 15px;border-radius:15px;cursor:pointer;color:var(--text-color);font-weight:bold}
.skip-btn:hover{background:var(--primary-color);color:#fff}
.score-box{display:none;margin-top:20px;padding:20px;border-radius:10px;border:2px solid var(--primary-color);background:var(--panel-bg);text-align:center;animation:fadeIn .3s}
.score-box.show{display:block}
.score-main{font-size:1.4rem;font-weight:bold;margin-bottom:12px}
.score-row{display:flex;justify-content:center;gap:20px;flex-wrap:wrap;font-weight:600}
.score-ok{color:var(--success-color)}.score-bad{color:var(--error-color)}.score-skip{opacity:.7}
.speed-btn{background:var(--border-color);border:none;padding:5px 15px;border-radius:15px;cursor:pointer;color:var(--text-color);font-weight:bold}
.speed-btn.active{background:var(--primary-color);color:#fff}
.tabs{display:flex;gap:10px;margin-bottom:20px;flex-wrap:wrap}
.tab-btn{padding:10px 20px;background:var(--panel-bg);border:1px solid var(--border-color);border-radius:8px;cursor:pointer;color:var(--text-color);font-weight:600}
.tab-btn.active{background:var(--primary-color);color:#fff;border-color:var(--primary-color)}
.tab-content{display:none;background:var(--panel-bg);padding:20px;border-radius:10px;box-shadow:0 4px 6px rgba(0,0,0,.05);line-height:1.6}
.tab-content.active{display:block}
.question-card{margin-bottom:25px;padding-bottom:20px;border-bottom:1px solid var(--border-color)}
.question-text{font-weight:bold;margin-bottom:15px;font-size:1.05rem}
.options-list{margin-bottom:15px;display:flex;flex-direction:column;gap:8px}
.option-label{display:flex;align-items:flex-start;gap:10px;cursor:pointer;padding:8px;border-radius:5px}
.option-label:hover{background:var(--highlight-bg)}
.option-label input[type="radio"]{cursor:pointer;width:18px;height:18px;margin-top:3px}
.result-box{display:none;margin-top:15px;padding:15px;border-radius:8px;border-left:5px solid}
.result-box.show{display:block;animation:fadeIn .3s}
.result-box.correct{background:var(--success-bg);border-color:var(--success-color)}
.result-box.wrong{background:var(--error-bg);border-color:var(--error-color)}
.feedback-title{font-weight:bold;margin-bottom:5px}
.feedback-title.correct{color:var(--success-color)}
.feedback-title.wrong{color:var(--error-color)}
.correct-answer-text{font-weight:bold;color:var(--success-color);margin-bottom:10px}
.explanation-text{font-size:.95rem;opacity:.9;font-style:italic}
.check-all-btn{display:block;width:100%;padding:15px;background:var(--primary-color);color:#fff;border:none;border-radius:8px;font-size:1.1rem;font-weight:bold;cursor:pointer;margin-top:20px}
.check-all-btn:hover{opacity:.9}
.dialogue-container{display:flex;flex-direction:column;gap:20px}
.dialogue-block{line-height:1.8;padding:10px;border-radius:8px;background:rgba(255,255,255,.02)}
.speaker-name{font-weight:bold;margin-right:5px}
.sentence-wrapper{position:relative;display:inline;cursor:pointer;border-bottom:1px dashed var(--border-color);padding:2px 0;border-radius:3px}
.sentence-wrapper.open{background:var(--highlight-bg);border-bottom-color:var(--primary-color)}
.sentence-wrapper.open .tooltip{visibility:visible;opacity:1;transform:translateX(-50%) translateY(-10px)}
@media(hover:hover){.sentence-wrapper:hover{background:var(--highlight-bg);border-bottom-color:var(--primary-color)}
.sentence-wrapper:hover .tooltip{visibility:visible;opacity:1;transform:translateX(-50%) translateY(-10px)}}
.tooltip{visibility:hidden;width:max-content;max-width:min(700px,90vw);white-space:normal;background:var(--tooltip-bg);color:var(--tooltip-text);text-align:center;border-radius:8px;padding:10px 16px;position:absolute;z-index:10;bottom:100%;left:50%;transform:translateX(-50%);opacity:0;transition:opacity .2s,transform .2s;font-size:.95rem;box-shadow:0 10px 25px -5px rgba(0,0,0,.3);pointer-events:none;line-height:1.5;border:1px solid var(--tooltip-border)}
.tooltip::after{content:"";position:absolute;top:100%;left:50%;margin-left:-6px;border-width:6px;border-style:solid;border-color:var(--tooltip-bg) transparent transparent transparent}
.vocab-list{list-style:none}
.vocab-item{display:flex;padding:12px 10px;border-bottom:1px solid var(--border-color);align-items:center}
.vocab-item:hover{background:var(--highlight-bg)}
.vocab-en{font-weight:bold;width:50%;cursor:pointer;color:var(--vocab-en-color);display:flex;align-items:center;gap:10px}
.vocab-en:hover{text-decoration:underline}
.vocab-az{width:50%}
@keyframes fadeIn{from{opacity:0;transform:translateY(-5px)}to{opacity:1;transform:translateY(0)}}
@media(max-width:768px){.tabs{flex-direction:column}.vocab-item{flex-direction:column;align-items:flex-start;gap:5px}.vocab-en,.vocab-az{width:100%}}
#toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:rgba(15,23,42,.92);color:#fff;padding:8px 18px;border-radius:20px;font-size:.95rem;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s;z-index:300}
#toast.show{opacity:1}
</style>
</head>

<script>
const ID="listening12";
const data={"title": "Listening 12", "audioSrc": "Listening 12.mp3", "questions": [{"id": "l12q1", "q": "1. Choose the correct statement according to the dialogue.", "options": ["A) Chris had a wonderful day.", "B) There was no problem in his new office today.", "C) Karen is a secretary who doesn't help anyone.", "D) The boss was angry with Karen.", "E) The boss's screaming at the customer on the phone is not very professional"], "correct": "E) The boss's screaming at the customer on the phone is not very professional", "correctText": "E) The boss's screaming at the customer on the phone is not very professional", "explanation": "Dialoqa əsasən düzgün ifadəni seçin. Dialoqda Kris müdirinin telefonda müştəriyə qışqırdığını deyir. Cenis isə buna cavab olaraq “Bu, çox da peşəkar deyil” deyir. Kris də onunla razılaşır."}, {"id": "l12q2", "q": "2. Complete the sentence according to the dialogue. The worst thing that happened in the office today was that ...", "options": ["A) there were workmen who were hammering and drilling.", "B) there was a barking dog in the office.", "C) their boss was shouting at the customer.", "D) their secretary was crying.", "E) someone from circus came to their office."], "correct": "B) there was a barking dog in the office.", "correctText": "B) there was a barking dog in the office.", "explanation": "Dialoqa əsasən cümləni tamamlayın. Bu gün ofisdə baş verən ən pis şey o idi ki, ... Kris ofisdəki ağlayan katibə, qışqıran müdir və səs-küylü fəhlələr haqqında danışdıqdan sonra deyir: “Mən sənə ən pis şeyi demədim! ... Ofisdə bir it var idi və o, hürürdü.”"}, {"id": "l12q3", "q": "3. Which of the following questions has no answer in the passage?", "options": ["A) What is Karen's job?", "B) Why was Karen sad?", "C) Where was the boss when Chris arrived?", "D) Why was the boss screaming at the customer?", "E) What is the colour of the dog?"], "correct": "D) Why was the boss screaming at the customer?", "correctText": "D) Why was the boss screaming at the customer?", "explanation": "Aşağıdakı suallardan hansının mətndə cavabı yoxdur? Dialoqda müdirin telefonda bir müştəriyə qışqırdığı deyilir, lakin onun nə üçün qışqırdığının səbəbi açıqlanmır."}, {"id": "l12q4", "q": "4. It is clear from the dialogue that ...", "options": ["A) Chris is fed up with working in the new office.", "B) Janice thinks that his new office is perfect.", "C) Their boss is a very professional person.", "D) Chris and his workmates don't have any problems with their boss.", "E) Karen is a rude and selfish person."], "correct": "A) Chris is fed up with working in the new office.", "correctText": "A) Chris is fed up with working in the new office.", "explanation": "Dialoqdan aydındır ki, … . Kris söhbətin əvvəlində “Mən orada işləməyə nifrət edirəm! Bəlkə də sadəcə yeni bir iş axtarmağa başlamalıyam” deyir. Bu, onun yeni ofisində işləməkdən bezdiyini göstərir."}, {"id": "l12q5", "q": "5. Answer the questions according to the passage. Why was the dog in the office?", "options": ["A) it was sick", "B) it was depressed", "C) it was lonely", "D) it was bored", "E) it was noisy"], "correct": "B) it was depressed", "correctText": "B) it was depressed", "explanation": "Mətnə əsasən suallara cavab verin. İt niyə ofisdə idi? Kris izah edir ki, itin sahibi Endryu onlara itin “depressiyada olduğunu və onu evdə tək qoymaq istəmədiyini” deyib."}], "text": [{"speaker": "Janice", "en": "Hi Chris, you look tired.", "az": "Salam Kris, yorğun görünürsən."}, {"speaker": "Chris", "en": "Hi Janice, I had a terrible day at work.", "az": "Salam Cenis, işdə dəhşətli bir gün keçirdim."}, {"speaker": "Chris", "en": "Just awful!", "az": "Sadəcə dəhşət!"}, {"speaker": "Janice", "en": "Oh, I'm sorry.", "az": "Oh, təəssüf edirəm."}, {"speaker": "Janice", "en": "Are you still having problems with your new office?", "az": "Hələ də yeni ofisinlə bağlı problemlərin var?"}, {"speaker": "Chris", "en": "When I got to the office this morning, it was like a battlefield.", "az": "Bu səhər ofisə çatanda ora döyüş meydanı kimi idi."}, {"speaker": "Chris", "en": "I hate working there!", "az": "Mən orada işləməyə nifrət edirəm!"}, {"speaker": "Chris", "en": "Maybe I should just start looking for a new job.", "az": "Bəlkə də sadəcə yeni bir iş axtarmağa başlamalıyam."}, {"speaker": "Janice", "en": "What happened this morning?", "az": "Bu səhər nə baş verib?"}, {"speaker": "Chris", "en": "Well for a start, Karen was crying.", "az": "İlk növbədə, Karen ağlayırdı."}, {"speaker": "Chris", "en": "She was saying nobody appreciated her.", "az": "Deyirdi ki, heç kim ona dəyər vermir."}, {"speaker": "Janice", "en": "Oh, poor thing!", "az": "Oh, yazıq!"}, {"speaker": "Janice", "en": "Who's Karen?", "az": "Karen kimdir?"}, {"speaker": "Chris", "en": "She's a secretary, but she does a lot of other things, she always helps everyone.", "az": "O, katibədir, amma başqa bir çox iş də görür, həmişə hamıya kömək edir."}, {"speaker": "Chris", "en": "She was sitting at her desk looking very sad and crying a little bit.", "az": "O, iş masasında çox kədərli görkəmdə oturmuşdu və bir az ağlayırdı."}, {"speaker": "Chris", "en": "She said the boss said mean things to her.", "az": "Dedi ki, müdir ona sərt sözlər deyib."}, {"speaker": "Chris", "en": "And the boss was so angry too.", "az": "Və müdir də çox əsəbi idi."}, {"speaker": "Janice", "en": "With Karen?", "az": "Karenə (əsəbiləşmişdi)?"}, {"speaker": "Chris", "en": "No, he was in his office and the door was closed, but everyone could hear him.", "az": "Xeyr, o öz otağında idi və qapı bağlı idi, amma hamı onu eşidə bilirdi."}, {"speaker": "Chris", "en": "He was screaming at a customer on the phone.", "az": "O, telefonda bir müştəriyə qışqırırdı."}, {"speaker": "Janice", "en": "That's not very professional.", "az": "Bu, çox da peşəkarcasına deyil."}, {"speaker": "Chris", "en": "He's not very professional.", "az": "O, çox peşəkar deyil."}, {"speaker": "Chris", "en": "So this was all happening when I arrived at nine thirty.", "az": "Bütün bunlar mən saat doqquzun yarısında gəlib çatanda baş verirdi."}, {"speaker": "Chris", "en": "A lot of noise too because there are workmen on the next floor up so they were hammering and banging and drilling.", "az": "Həm də çox səs-küy var idi, çünki yuxarıdakı mərtəbədə fəhlələr var, ona görə də onlar çəkicləyir, vurur və qazırdılar."}, {"speaker": "Janice", "en": "Wow, that sounds a crazy office.", "az": "Vau, bu, çılğın bir ofisə bənzəyir."}, {"speaker": "Chris", "en": "I didn't tell you the worst thing!", "az": "Mən sənə ən pis şeyi demədim!"}, {"speaker": "Janice", "en": "There's something worse than all the crying, shouting and hammering?", "az": "Bütün bu ağlamaqdan, qışqırmaqdan və çəkicləməkdən daha pis bir şey var?"}, {"speaker": "Chris", "en": "Yes, there was a dog in the office and it was barking.", "az": "Bəli, ofisdə bir it var idi və o, hürürdü."}, {"speaker": "Janice", "en": "A barking dog?", "az": "Hürən it?"}, {"speaker": "Janice", "en": "Now I know you're joking with me.", "az": "İndi bilirəm ki, mənimlə zarafat edirsən."}, {"speaker": "Chris", "en": "I'm not.", "az": "Yox (zarafat etmirəm)."}, {"speaker": "Chris", "en": "Andrew from the sales department took his dog to work today -- it's a little black poodle called Betsy.", "az": "Satış şöbəsindən Endryu bu gün itini işə gətirib -- Betsi adlı balaca qara bir pudeldir."}, {"speaker": "Chris", "en": "He put her in his bag and didn't tell anyone, he told us later that the dog is depressed and that he didn't want to leave her at home alone.", "az": "O, onu çantasına qoyub və heç kimə deməyib, sonra bizə dedi ki, it depressiyadadır və onu evdə tək qoymaq istəməyib."}, {"speaker": "Chris", "en": "So he took her to work.", "az": "Ona görə də onu işə gətirib."}, {"speaker": "Chris", "en": "That's completely normal, isn't it?", "az": "Bu, tamamilə normaldır, deyilmi?"}, {"speaker": "Janice", "en": "A depressed dog hidden in a bag in an office with crying secretaries, screaming bosses and the whole room full of drilling and hammering?", "az": "Ağlayan katibələrin, qışqıran müdirlərin və qazma və çəkicləmə ilə dolu bütün otağın olduğu bir ofisdə çantada gizlədilmiş depressiyalı bir it?"}, {"speaker": "Janice", "en": "Do you work for a circus?", "az": "Sən sirkdə işləyirsən?"}, {"speaker": "Chris", "en": "I wish!", "az": "Kaş ki!"}], "vocabulary": [{"en": "Awful", "az": "dəhşətli, biabırçı"}, {"en": "Battlefield", "az": "döyüş meydanı"}, {"en": "Circus", "az": "sirk"}, {"en": "Customer", "az": "müştəri"}, {"en": "Depressed", "az": "depressiyada, məyus"}, {"en": "Fed up with", "az": "bezmək"}, {"en": "I wish!", "az": "kaş ki!"}, {"en": "Lonely", "az": "tənha"}, {"en": "Mean", "az": "kobud/sərt"}, {"en": "Noise", "az": "səs-küy"}, {"en": "Poodle", "az": "pudel (it cinsi)"}, {"en": "Poor", "az": "yazıq; kasıb"}, {"en": "Professional", "az": "peşəkar"}, {"en": "Rude", "az": "kobud"}, {"en": "Secretary", "az": "katibə"}, {"en": "Selfish", "az": "eqoist"}, {"en": "Terrible", "az": "dəhşətli"}, {"en": "Tired", "az": "yorğun"}, {"en": "To appreciate", "az": "dəyər vermək, qiymətləndirmək"}, {"en": "To bark", "az": "hürmək"}, {"en": "To drill", "az": "qazmaq (alətlə)"}, {"en": "To hammer", "az": "çəkicləmək (isim kimi hammer - çəkic)"}, {"en": "To hide", "az": "gizlətmək, gizlənmək"}, {"en": "To joke", "az": "zarafat etmək"}, {"en": "To scream", "az": "qışqırmaq"}, {"en": "Workman", "az": "fəhlə"}]};
const speakerColors=['#3b82f6','#ef4444','#10b981','#f59e0b','#8b5cf6','#ec4899'];
const PK='sa:'+ID+':progress',HK='sa:'+ID+':history';
let prog=null,hist=[],attemptLogged=false;
try{prog=JSON.parse(localStorage.getItem(PK))}catch(e){prog=null}
try{hist=JSON.parse(localStorage.getItem(HK))||[]}catch(e){hist=[]}
function save(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
function openTab(n,b){document.querySelectorAll('.tab-content').forEach(e=>e.classList.remove('active'));document.querySelectorAll('.tab-btn').forEach(e=>e.classList.remove('active'));document.getElementById(n).classList.add('active');if(b)b.classList.add('active')}
function skipAudio(n){const a=document.getElementById('audio-player');a.currentTime=Math.max(0,Math.min(a.duration||1e9,a.currentTime+n))}
function applySpeed(s){const a=document.getElementById('audio-player');a.defaultPlaybackRate=s;a.playbackRate=s;document.querySelectorAll('.speed-btn').forEach(e=>e.classList.toggle('active',parseFloat(e.textContent)===s))}
function changeSpeed(s){applySpeed(s);try{localStorage.setItem('audioSpeed',s)}catch(e){}}
let toastTimer=null;function showToast(t){const e=document.getElementById('toast');e.innerText=t;e.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>e.classList.remove('show'),900)}
function changeVolume(d){const a=document.getElementById('audio-player');a.volume=Math.max(0,Math.min(1,Math.round((a.volume+d)*100)/100));showToast('Səs: '+Math.round(a.volume*100)+'%')}
document.addEventListener('keydown',e=>{const tag=e.target.tagName;if(tag==='INPUT'||tag==='TEXTAREA'||tag==='SELECT'||e.ctrlKey||e.metaKey||e.altKey)return;const a=document.getElementById('audio-player');if(e.code==='Space'){e.preventDefault();e.stopPropagation();if(e.repeat)return;if(a.paused){const pr=a.play();if(pr&&pr.catch)pr.catch(()=>{})}else a.pause()}else if(e.code==='ArrowRight'||e.code==='Numpad6'){e.preventDefault();e.stopPropagation();skipAudio(5)}else if(e.code==='ArrowLeft'||e.code==='Numpad4'){e.preventDefault();e.stopPropagation();skipAudio(-5)}else if(e.code==='ArrowUp'||e.code==='Numpad8'){e.preventDefault();e.stopPropagation();changeVolume(0.05)}else if(e.code==='ArrowDown'||e.code==='Numpad2'){e.preventDefault();e.stopPropagation();changeVolume(-0.05)}},true);
document.addEventListener('keyup',e=>{if(e.code==='Space'&&e.target.tagName!=='INPUT'&&e.target.tagName!=='TEXTAREA')e.preventDefault()});
function speakWord(w){if('speechSynthesis'in window){window.speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(w);u.lang='en-US';window.speechSynthesis.speak(u)}}
function updateLock(){const d=!!prog;document.getElementById('text-lock').style.display=d?'none':'block';document.getElementById('dialogue-container').style.display=d?'':'none';document.getElementById('tab-text-btn').innerHTML=d?'2. Mətn':'<i class="fas fa-lock"></i> 2. Mətn'}
function fmtDate(ts){const d=new Date(ts),p=n=>String(n).padStart(2,'0');return `${p(d.getDate())}.${p(d.getMonth()+1)}.${d.getFullYear()}, ${p(d.getHours())}:${p(d.getMinutes())}`}
function scoreClass(ok,total){const r=total?ok/total:0;return r>=0.8?'good':(r>=0.5?'mid':'low')}
function renderResults(){const c=document.getElementById('results-container');
if(!hist.length&&!prog){c.innerHTML='<div class="lock-box"><i class="fas fa-clipboard-list"></i>Bu Listening üçün hələ nəticə yoxdur. Suallara cavab verib “Cavabları Yoxla” düyməsinə basın.</div>';return}
if(!hist.length){c.innerHTML=`<div class="res-row"><div><div class="res-no">Əvvəlki nəticə</div><div class="res-date">Tarix qeyd olunmayıb</div></div><div class="res-right"><div class="res-score ${scoreClass(prog.ok,prog.total)}">${prog.ok} / ${prog.total}</div></div></div>`;return}
const best=Math.max(...hist.map(x=>x.ok)),last=hist[hist.length-1];
let html=`<div class="res-summary"><div class="res-chip">Cəhd sayı<b>${hist.length}</b></div><div class="res-chip">Ən yaxşı nəticə<b>${best} / ${last.total}</b></div><div class="res-chip">Son nəticə<b>${last.ok} / ${last.total}</b></div></div>`;
hist.map((x,i)=>({x,i})).reverse().forEach(({x,i})=>{html+=`<div class="res-row"><div><div class="res-no">Cəhd ${i+1}</div><div class="res-date"><i class="fas fa-clock"></i> ${fmtDate(x.t)}</div></div><div class="res-right"><div class="res-score ${scoreClass(x.ok,x.total)}">${x.ok} / ${x.total}</div><div class="res-detail">Düz: ${x.ok} · Səhv: ${x.bad} · Cavabsız: ${x.skip}</div></div></div>`});
c.innerHTML=html}
function retryQuiz(){attemptLogged=false;document.querySelectorAll('#questions-container input[type=radio]').forEach(r=>r.checked=false);document.querySelectorAll('#questions-container .result-box').forEach(b=>b.className='result-box');document.querySelectorAll('#questions-container .correct-answer-text').forEach(e=>e.style.display='none');const sb=document.getElementById('score-box');sb.classList.remove('show');sb.innerHTML='';document.getElementById('questions-container').scrollIntoView({behavior:'smooth',block:'start'})}
function checkAllAnswers(){let ok=0,bad=0,skip=0;data.questions.forEach(q=>{const s=document.querySelector(`input[name="${q.id}"]:checked`),b=document.getElementById(`result-${q.id}`),f=document.getElementById(`feedback-${q.id}`);if(!s){skip++;f.innerText="Cavab seçilməyib!";f.className="feedback-title";b.className="result-box show";document.getElementById(`correct-text-${q.id}`).style.display="block";return}if(s.value===q.correct){ok++;f.innerText="Düzdür!";f.className="feedback-title correct";b.className="result-box show correct"}else{bad++;f.innerText="Səhvdir!";f.className="feedback-title wrong";b.className="result-box show wrong"}document.getElementById(`correct-text-${q.id}`).style.display="block"});
const sb=document.getElementById('score-box');sb.innerHTML=`<div class="score-main">Nəticə: ${ok} / ${data.questions.length}</div><div class="score-row"><span class="score-ok"><i class="fas fa-check-circle"></i> Düz: ${ok}</span><span class="score-bad"><i class="fas fa-times-circle"></i> Səhv: ${bad}</span><span class="score-skip"><i class="fas fa-minus-circle"></i> Cavabsız: ${skip}</span></div>${ok+bad>0?'<div class="score-note">Mətn bölməsi açıldı.</div>':''}<button class="retry-btn" onclick="retryQuiz()"><i class="fas fa-rotate-right"></i> Yenidən cəhd et</button>`;sb.classList.add('show');
if(ok+bad>0){prog={ok,total:data.questions.length};save(PK,prog);if(!attemptLogged){hist.push({t:Date.now(),ok,bad,skip,total:data.questions.length});save(HK,hist);attemptLogged=true}updateLock();renderResults()}
sb.scrollIntoView({behavior:'smooth',block:'center'})}
function adjustTooltip(e){const t=e.querySelector('.tooltip');if(!t)return;t.style.left='50%';t.style.right='auto';t.style.transform='translateX(-50%) translateY(-10px)';const r=t.getBoundingClientRect(),w=window.innerWidth;if(r.left<10){t.style.left=`calc(50% + ${10-r.left}px)`}else if(r.right>w-10){t.style.left=`calc(50% - ${r.right-(w-10)}px)`}}
function toggleTip(e){const was=e.classList.contains('open');document.querySelectorAll('.sentence-wrapper.open').forEach(x=>x.classList.remove('open'));if(!was){e.classList.add('open');adjustTooltip(e)}}
function render(){const d=data;document.title=d.title;document.getElementById('audio-player').src=d.audioSrc;
const q=document.getElementById('questions-container');q.innerHTML='';d.questions.forEach(item=>{const o=item.options.map(x=>`<label class="option-label"><input type="radio" name="${item.id}" value="${x}"><span>${x}</span></label>`).join('');q.innerHTML+=`<div class="question-card"><div class="question-text">${item.q}</div><div class="options-list">${o}</div><div class="result-box" id="result-${item.id}"><div class="feedback-title" id="feedback-${item.id}"></div><div class="correct-answer-text" id="correct-text-${item.id}" style="display:none;">Düzgün cavab: ${item.correctText}</div><div class="explanation-text"><strong>İzah:</strong> ${item.explanation}</div></div></div>`});
const v=document.getElementById('vocab-list');v.innerHTML='';d.vocabulary.forEach(item=>{v.innerHTML+=`<li class="vocab-item"><div class="vocab-en" onclick="speakWord('${item.en.replace(/'/g,"\\'")}')"><i class="fas fa-volume-up"></i> ${item.en}</div><div class="vocab-az">${item.az}</div></li>`});
const t=document.getElementById('dialogue-container');t.innerHTML='';const u=[...new Set(d.text.map(i=>i.speaker))],c={};u.forEach((s,i)=>c[s]=speakerColors[i%speakerColors.length]);const g=[];d.text.forEach(i=>{if(g.length>0&&g[g.length-1].speaker===i.speaker)g[g.length-1].sentences.push(i);else g.push({speaker:i.speaker,sentences:[i]})});
g.forEach(x=>{const h=x.sentences.map(s=>`<span class="sentence-wrapper" onmouseenter="adjustTooltip(this)" onclick="toggleTip(this)">${s.en}<span class="tooltip">${s.az}</span></span>`).join(' ');t.innerHTML+=`<div class="dialogue-block"><span class="speaker-name" style="color:${c[x.speaker]};">${x.speaker}:</span> <span class="speaker-text">${h}</span></div>`});
updateLock();renderResults()}
window.onload=()=>{render();document.getElementById('questions-container').addEventListener('change',()=>{attemptLogged=false});
try{const sp=parseFloat(localStorage.getItem('audioSpeed'));if([0.75,1,1.25].includes(sp))applySpeed(sp)}catch(e){}};
</script>
</body>
</html>
