{"id":"l29q1","q":"1. Choose the correct statement according to the dialogue.","options":["A) Nick came to take Sarah out for a date.","B) Sarah's sister confused Nick with someone else.","C) Nick wants to join Sarah's Spanish class.","D) Sarah invited Nick to a family dinner.","E) Nick lied about his identity at the beginning."],"correct":"B) Sarah's sister confused Nick with someone else.","correctText":"B) Sarah's sister confused Nick with someone else.","explanation":"Dialoqa əsasən düzgün ifadəni seçin. Dialoqun sonunda bacı soruşur: \"Deməli, sən o dəli motosikleti sürən Nik Roberts deyilsən? Belində böyük ilan döyməsi olan?\" Bu sual onun Niki başqa bir şəxslə səhv saldığını açıq şəkildə göstərir."},
{"id":"l29q2","q":"2. What is Nick's actual reason for visiting Sarah?","options":["A) He wants to ask her out.","B) He's delivering a package.","C) He is her Spanish tutor.","D) He's her classmate from high school.","E) He came for a job interview."],"correct":"C) He is her Spanish tutor.","correctText":"C) He is her Spanish tutor.","explanation":"Nikin Saranı ziyarət etməsinin əsl səbəbi nədir? Nik vəziyyəti aydınlaşdırarkən deyir: \"Mən universitetdə müəllim köməkçisiyəm və Sara ilə keçən həftə ispan dili dərsində tanış olmuşam. O, məndən ona dərs keçməyimi, yəni dərslərinə kömək etməyimi xahiş etdi.\""},
{"id":"l29q3","q":"3. How old is Sarah?","options":["A) 21","B) 22","C) 18","D) 19","E) 20"],"correct":"D) 19","correctText":"D) 19","explanation":"Saranın neçə yaşı var? Nik yaşının nə fərqi olduğunu soruşduqda, böyük bacı cavab verir: \"Saranın cəmi 19 yaşı var.\""},
{"id":"l29q4","q":"4. What was Sarah's sister's first assumption about Nick?","options":["A) He was a friend from childhood.","B) He was her Spanish teacher.","C) He was Nick Roberts with a tattoo motorcycle.","D) He was lost and needed directions.","E) He was a new neighbor."],"correct":"C) He was Nick Roberts with a tattoo motorcycle.","correctText":"C) He was Nick Roberts with a tattoo motorcycle.","explanation":"Saranın bacısının Nik haqqında ilk fərziyyəsi nə idi? Bacının bütün aqressiv sualları və davranışları onun Niki təhlükəli hesab etdiyi bir şəxslə səhv salmasından irəli gəlirdi. Sonda bu şəxsi \"tatuajı və motosikleti olan Nik Roberts\" kimi təsvir edir."},
{"id":"l29q5","q":"5. What does Nick decide to do at the end of the conversation?","options":["A) Call Sarah.","B) Stay and explain.","C) Leave the place.","D) Ask for payment.","E) Meet Sarah's parents."],"correct":"C) Leave the place.","correctText":"C) Leave the place.","explanation":"Nik söhbətin sonunda nə etmək qərarına gəlir? Vəziyyətin səhv anlaşıldığını görən Nik deyir: \"Mən gedirəm. Bütün bu olanlar axmaqlıqdır.\""}],
"text":[
{"speaker":"Nick","en":"Hi. Uh, are you Sarah?","az":"Salam. Uh, siz Sarasınız?"},
{"speaker":"The Big Sister","en":"No, I'm not. I'm her older sister.","az":"Xeyr, deyiləm. Mən onun böyük bacısıyam."},
{"speaker":"Nick","en":"Well, I'm here to talk to . . .","az":"Yaxşı, mən danışmaq üçün buradayam..."},

{"speaker":"Nick","en":"Good. Uh, Is Sarah here?","az":"Yaxşı. Uh, Sara buradadır?"},
{"speaker":"The Big Sister","en":"Um, first, I have a couple questions, and you [had] better answer them. What is your name?","az":"Um, əvvəlcə bir neçə sualım var və yaxşı olar ki, onlara cavab verəsən. Adın nədir?"},
{"speaker":"Nick","en":"What ... umm, my name? Uh, I'm Nick ...","az":"Nə... umm, mənim adım? Uh, mən Nikəm..."},

{"speaker":"Nick","en":"What!?","az":"Nə!?"},
{"speaker":"The Big Sister","en":"How old are you?","az":"Neçə yaşın var?"},
{"speaker":"Nick","en":"Does that matter?","az":"Bunun fərqi var ki?"},
{"speaker":"The Big Sister","en":"Of course, it matters. I wouldn't be asking otherwise.","az":"Əlbəttə, fərqi var. Əks halda soruşmazdım."},
{"speaker":"Nick","en":"Really?","az":"Həqiqətən?"},
{"speaker":"The Big Sister","en":"Really. Yeah. Sarah's only 19.","az":"Həqiqətən. Bəli. Saranın cəmi 19 yaşı var."},
{"speaker":"Nick","en":"Ugh! Okay, I'm 22. Now, is Sarah here?","az":"Uf! Yaxşı, mənim 22 yaşım var. İndi, Sara buradadır?"},
{"speaker":"The Big Sister","en":"Where did you first meet Sarah and why do you like her so much?","az":"Sara ilə ilk dəfə harada tanış olmusan və niyə onu bu qədər çox bəyənirsən?"},
{"speaker":"Nick","en":"Like her? What do you mean? I've only met her once in . . .","az":"Onu bəyənirəm? Nə demək istəyirsiniz? Mən onunla cəmi bir dəfə tanış olmuşam..."},
{"speaker":"The Big Sister","en":"Don't lie to me, Nick.","az":"Mənə yalan danışma, Nik."},
{"speaker":"Nick","en":"Are you sure you have the right guy? Li .... Are you sure? [Yeah, I'm sure, I'm sure.] Li ... Listen. I'm leaving. I don't need the money THAT much.","az":"Əminsiniz ki, doğru adamı tutmusunuz? Li... Əminsiniz? [Bəli, əminəm, əminəm.] Li... Qulaq asın. Mən gedirəm. Mənə pul O QƏDƏR də lazım deyil."},
{"speaker":"The Big Sister","en":"What?! Money? Wait! Wait! What do you mean money?","az":"Nə?! Pul? Gözlə! Gözlə! Nə pul demək istəyirsən?"},

{"speaker":"The Big Sister","en":"So, you're not Nick Roberts, that guy that drives that crazy motorcycle? [No!] The one with the large tattoo of a snake across his back?","az":"Deməli, sən o dəli motosikleti sürən Nik Roberts deyilsən? [Xeyr!] Belində böyük ilan döyməsi olan?"},
{"speaker":"Nick","en":"No! What? You've got the wrong guy. I'm leaving. This whole thing is crazy.","az":"Xeyr! Nə? Siz səhv salmısınız. Mən gedirəm. Bütün bu olanlar axmaqlıqdır."}],

function openTab(n,b){document.querySelectorAll('.tab-content').forEach(e=>e.classList.remove('active'));document.querySelectorAll('.tab-btn').forEach(e=>e.classList.remove('active'));document.getElementById(n).classList.add('active');if(b)b.classList.add('active')}

let toastTimer=null;function showToast(t){const e=document.getElementById('toast');e.innerText=t;e.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>e.classList.remove('show'),900)}
function changeVolume(d){const a=document.getElementById('audio-player');a.volume=Math.max(0,Math.min(1,Math.round((a.volume+d)*100)/100));showToast('Səs: '+Math.round(a.volume*100)+'%')}
document.addEventListener('keydown',e=>{const tag=e.target.tagName;if(tag==='INPUT'||tag==='TEXTAREA'||tag==='SELECT'||e.ctrlKey||e.metaKey||e.altKey)return;const a=document.getElementById('audio-player');if(e.code==='Space'){e.preventDefault();e.stopPropagation();if(e.repeat)return;if(a.paused){const pr=a.play();if(pr&&pr.catch)pr.catch(()=>{})}else a.pause()}else if(e.code==='ArrowRight'||e.code==='Numpad6'){e.preventDefault();e.stopPropagation();skipAudio(5)}else if(e.code==='ArrowLeft'||e.code==='Numpad4'){e.preventDefault();e.stopPropagation();skipAudio(-5)}else if(e.code==='ArrowUp'||e.code==='Numpad8'){e.preventDefault();e.stopPropagation();changeVolume(0.05)}else if(e.code==='ArrowDown'||e.code==='Numpad2'){e.preventDefault();e.stopPropagation();changeVolume(-0.05)}},true);
document.addEventListener('keyup',e=>{if(e.code==='Space'&&e.target.tagName!=='INPUT'&&e.target.tagName!=='TEXTAREA')e.preventDefault()});
function speakWord(w){if('speechSynthesis'in window){window.speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(w);u.lang='en-US';window.speechSynthesis.speak(u)}}
function updateLock(){const d=!!prog;document.getElementById('text-lock').style.display=d?'none':'block';document.getElementById('dialogue-container').style.display=d?'':'none';document.getElementById('tab-text-btn').innerHTML=d?'2. Mətn':'<i class="fas fa-lock"></i> 2. Mətn'}
function fmtDate(ts){const d=new Date(ts),p=n=>String(n).padStart(2,'0');return `${p(d.getDate())}.${p(d.getMonth()+1)}.${d.getFullYear()}, ${p(d.getHours())}:${p(d.getMinutes())}`}
function scoreClass(ok,total){const r=total?ok/total:0;return r>=0.8?'good':(r>=0.5?'mid':'low')}
function renderResults(){const c=document.getElementById('results-container');
if(!hist.length&&!prog){c.innerHTML='<div class="lock-box"><i class="fas fa-clipboard-list"></i>Bu Listening üçün hələ nəticə yoxdur. Suallara cavab verib "Cavabları Yoxla" düyməsinə basın.</div>';return}
if(!hist.length){c.innerHTML=`<div class="res-row"><div><div class="res-no">Əvvəlki nəticə</div><div class="res-date">Tarix qeyd olunmayıb</div></div><div class="res-right"><div class="res-score ${scoreClass(prog.ok,prog.total)}">${prog.ok} / ${prog.total}</div></div></div>`;return}
const best=Math.max(...hist.map(x=>x.ok)),last=hist[hist.length-1];
let html=`<div class="res-summary"><div class="res-chip">Cəhd sayı<b>${hist.length}</b></div><div class="res-chip">Ən yaxşı nəticə<b>${best} / ${last.total}</b></div><div class="res-chip">Son nəticə<b>${last.ok} / ${last.total}</b></div></div>`;
hist.map((x,i)=>({x,i})).reverse().forEach(({x,i})=>{html+=`<div class="res-row"><div><div class="res-no">Cəhd ${i+1}</div><div class="res-date"><i class="fas fa-clock"></i> ${fmtDate(x.t)}</div></div><div class="res-right"><div class="res-score ${scoreClass(x.ok,x.total)}">${x.ok} / ${x.total}</div><div class="res-detail">Düz: ${x.ok} · Səhv: ${x.bad} · Cavabsız: ${x.skip}</div></div></div>`});
c.innerHTML=html}
